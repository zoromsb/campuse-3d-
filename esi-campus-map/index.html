          satCalibPanel.classList.add('visible');
        } else {
          // Restore camera
          if (savedCameraState) {
            camera.position.copy(savedCameraState.pos);
            controls.target.copy(savedCameraState.target);
            controls.maxPolarAngle = savedCameraState.polar;
            controls.update();
          }
          clearEditorSelection();
          editFormDiv.classList.remove('visible');
          showHint('');
          cancelDraw();
          // Hide satellite underlay when leaving edit mode
          satVisible = false;
          if (satPlane) satPlane.visible = false;
          satCalibPanel.classList.remove('visible');
        }
      });

      function setDrawMode(mode) {
        editorDrawMode = mode;
        cancelDraw();
        clearEditorSelection();
        document.getElementById('selectModeBtn').classList.toggle('active', mode === null);
        document.getElementById('drawBuildingBtn').classList.toggle('active', mode === 'building');
        document.getElementById('drawRoadBtn').classList.toggle('active', mode === 'road');
        if (mode === 'building') showHint('Click to place polygon vertices, double-click or Enter to close shape');
        else if (mode === 'road') showHint('Click to place road path points, double-click or Enter to finish');
        else showHint('Click a building/road to select, drag to move');
      }

      document.getElementById('selectModeBtn').addEventListener('click', () => setDrawMode(null));
      document.getElementById('drawBuildingBtn').addEventListener('click', () => setDrawMode('building'));
      document.getElementById('drawRoadBtn').addEventListener('click', () => setDrawMode('road'));

      // --- Drawing ---
      function cancelDraw() {
        drawPoints = [];
        if (drawPreviewLine) { scene.remove(drawPreviewLine); drawPreviewLine.geometry.dispose(); drawPreviewLine.material.dispose(); drawPreviewLine = null; }
      }

      function updateDrawPreview(currentPt) {
        if (drawPreviewLine) { scene.remove(drawPreviewLine); drawPreviewLine.geometry.dispose(); drawPreviewLine.material.dispose(); }
        const pts = [...drawPoints];
        if (currentPt) pts.push(currentPt);
        if (pts.length < 2) { drawPreviewLine = null; return; }
        const verts = [];
        pts.forEach(p => verts.push(p[0], 0.15, p[1]));
        // Close loop for building preview
        if (editorDrawMode === 'building' && pts.length >= 3) { verts.push(pts[0][0], 0.15, pts[0][1]); }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
        drawPreviewLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 }));
        scene.add(drawPreviewLine);
      }

      function finishDrawBuilding() {
        if (drawPoints.length < 3) { showHint('Need at least 3 points'); return; }
        // Compute centroid to use as anchor, make footprint relative
        const c = polygonCentroid(drawPoints);
        const fp = drawPoints.map(p => [p[0] - c[0], p[1] - c[1]]);
        const id = 'bloc-' + (CAMPUS_DATA.buildings.length + 1);
        const building = { id, name: 'Bloc ' + (CAMPUS_DATA.buildings.length + 1), x: c[0], z: c[1], rotation: 0, height: 8, footprint: fp, rooms: [] };
        CAMPUS_DATA.buildings.push(building);
        cancelDraw();
        rebuildCampus(CAMPUS_DATA);
        autosaveDraft();
        showHint('Building created! Click it to edit properties');
      }

      function finishDrawRoad() {
        if (drawPoints.length < 2) { showHint('Need at least 2 points'); return; }
        const id = 'road-' + ((CAMPUS_DATA.roads || []).length + 1);
        const road = { id, width: 6, path: drawPoints.map(p => [p[0], p[1]]) };
        if (!CAMPUS_DATA.roads) CAMPUS_DATA.roads = [];
        CAMPUS_DATA.roads.push(road);
        cancelDraw();
        rebuildCampus(CAMPUS_DATA);
        autosaveDraft();
        showHint('Road created!');
      }

      // --- Selection + handles ---
      function clearEditorSelection() {
        editorSelected = null;
        editorHandles.forEach(h => { scene.remove(h); h.geometry.dispose(); h.material.dispose(); });
        editorHandles = [];
        if (editorRotHandle) { scene.remove(editorRotHandle); editorRotHandle.geometry.dispose(); editorRotHandle.material.dispose(); editorRotHandle = null; }
        editFormDiv.classList.remove('visible');
      }

      function selectBuilding(building) {
        clearEditorSelection();
        const idx = CAMPUS_DATA.buildings.indexOf(building);
        if (idx < 0) return;
        editorSelected = { type: 'building', data: building, index: idx };
        ensureFootprint(building);

        // Vertex handles
        const rot = THREE.MathUtils.degToRad(building.rotation || 0);
        const cosR = Math.cos(rot), sinR = Math.sin(rot);
        building.footprint.forEach((v, vi) => {
          const wx = building.x + cosR * v[0] - sinR * v[1];
          const wz = building.z + sinR * v[0] + cosR * v[1];
          const handleGeo = new THREE.SphereGeometry(0.6, 8, 8);
          const handleMat = new THREE.MeshBasicMaterial({ color: 0xffff00, depthTest: false });
          const handle = new THREE.Mesh(handleGeo, handleMat);
          handle.position.set(wx, 0.5, wz);
          handle.userData = { isHandle: true, vertexIndex: vi };
          handle.renderOrder = 999;
          scene.add(handle);
          editorHandles.push(handle);
        });

        // Rotation handle
        const c = polygonCentroid(building.footprint);
        const bounds = footprintBounds(building.footprint);
        const rotDist = Math.max(bounds.w, bounds.d) / 2 + 4;
        const rhx = building.x + cosR * (c[0] + rotDist) - sinR * c[1];
        const rhz = building.z + sinR * (c[0] + rotDist) + cosR * c[1];
        const rotGeo = new THREE.SphereGeometry(0.8, 8, 8);
        const rotMat = new THREE.MeshBasicMaterial({ color: 0xff8800, depthTest: false });
        editorRotHandle = new THREE.Mesh(rotGeo, rotMat);
        editorRotHandle.position.set(rhx, 0.5, rhz);
        editorRotHandle.userData = { isRotHandle: true };
        editorRotHandle.renderOrder = 999;
        scene.add(editorRotHandle);

        // Show edit form
        editBuildingForm.style.display = 'block';
        editRoadForm.style.display = 'none';
        document.getElementById('editId').value = building.id;
        document.getElementById('editName').value = building.name;
        document.getElementById('editLevels').value = building.levels || 1;
        document.getElementById('editLevelHeight').value = building.levelHeight || 3.2;
        document.getElementById('editRotation').value = building.rotation || 0;
        document.getElementById('editFpInfo').textContent = `Footprint: ${building.footprint.length} vertices`;
        editFormDiv.classList.add('visible');
        renderRoomList(building);
      }

      function selectRoad(road) {
        clearEditorSelection();
        const idx = (CAMPUS_DATA.roads || []).indexOf(road);
        if (idx < 0) return;
        editorSelected = { type: 'road', data: road, index: idx };

        // Path point handles
        road.path.forEach((v, vi) => {
          const handleGeo = new THREE.SphereGeometry(0.6, 8, 8);
          const handleMat = new THREE.MeshBasicMaterial({ color: 0xffff00, depthTest: false });
          const handle = new THREE.Mesh(handleGeo, handleMat);
          handle.position.set(v[0], 0.5, v[1]);
          handle.userData = { isHandle: true, vertexIndex: vi };
          handle.renderOrder = 999;
          scene.add(handle);
          editorHandles.push(handle);
        });

        // Show road edit form
        editBuildingForm.style.display = 'none';
        editRoadForm.style.display = 'block';
        document.getElementById('editRoadId').value = road.id;
        document.getElementById('editRoadWidth').value = road.width || 6;
        document.getElementById('editPathInfo').textContent = `Path: ${road.path.length} points`;
        editFormDiv.classList.add('visible');
      }

      // --- Room list rendering in editor form ---
      const editRoomListEl = document.getElementById('editRoomList');
      const ROOM_TYPES = ['amphitheater', 'classroom', 'lab', 'office', 'library', 'study', 'gym', 'locker', 'hallway', 'other'];

      function renderRoomList(building) {
        editRoomListEl.innerHTML = '';
        if (!building.rooms || building.rooms.length === 0) return;
        // If in splitMode, show rooms for splitCurrentLevel, otherwise show all rooms
        const roomsToShow = splitMode
          ? building.rooms.filter(r => (r.floor !== undefined ? r.floor : 1) === splitCurrentLevel)
          : building.rooms;

        if (splitMode && roomsToShow.length === 0) {
          const empty = document.createElement('div');
          empty.style.cssText = 'color:#00ffff66;font-size:11px;font-style:italic;padding:4px;';
          empty.textContent = `No rooms on Level ${splitCurrentLevel}`;
          editRoomListEl.appendChild(empty);
          return;
        }

        roomsToShow.forEach((room) => {
          const ri = building.rooms.indexOf(room);
          const div = document.createElement('div');
          div.className = 'room-entry';
          const color = ROOM_COLORS[ri % ROOM_COLORS.length];
          div.style.borderLeftColor = '#' + color.toString(16).padStart(6, '0');
          div.style.borderLeftWidth = '3px';

          const nameLbl = document.createElement('label');
          nameLbl.textContent = 'Name ';
          const nameIn = document.createElement('input');
          nameIn.type = 'text'; nameIn.value = room.name || '';
          nameIn.style.cssText = 'background:rgba(0,20,30,0.9);border:1px solid #00ffff44;border-radius:4px;color:#00ffff;padding:2px 6px;font-family:monospace;font-size:11px;outline:none;';
          nameIn.addEventListener('change', () => { room.name = nameIn.value; autosaveDraft(); });
          nameLbl.appendChild(nameIn);
          div.appendChild(nameLbl);

          const typeLbl = document.createElement('label');
          typeLbl.textContent = 'Type ';
          const typeSel = document.createElement('select');
          ROOM_TYPES.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t; opt.textContent = t;
            if (room.type === t) opt.selected = true;
            typeSel.appendChild(opt);
          });
          typeSel.addEventListener('change', () => { room.type = typeSel.value; autosaveDraft(); });
          typeLbl.appendChild(typeSel);
          div.appendChild(typeLbl);

          const floorLbl = document.createElement('label');
          floorLbl.textContent = 'Floor ';
          const floorIn = document.createElement('input');
          floorIn.type = 'number'; floorIn.value = room.floor !== undefined ? room.floor : 1; floorIn.min = 1; floorIn.step = 1;
          floorIn.max = building.levels || 1;
          floorIn.style.cssText = 'background:rgba(0,20,30,0.9);border:1px solid #00ffff44;border-radius:4px;color:#00ffff;padding:2px 6px;font-family:monospace;font-size:11px;outline:none;width:50px;';
          floorIn.addEventListener('change', () => {
            const maxLevels = building.levels || 1;
            let newFloor = parseInt(floorIn.value) || 1;
            if (newFloor < 1) newFloor = 1;
            if (newFloor > maxLevels) newFloor = maxLevels;
            
            room.floor = newFloor;
            floorIn.value = newFloor;
            
            autosaveDraft();
            if (splitMode) { generateGrid(); updateSplitVisuals(); renderRoomList(building); }
          });
          floorLbl.appendChild(floorIn);
          div.appendChild(floorLbl);

          // Delete Room button
          const delBtn = document.createElement('button');
          delBtn.className = 'room-del-btn';
          delBtn.textContent = '🗑 Delete Room';
          delBtn.addEventListener('click', () => {
            if (splitMode) {
              splitHistory.push(JSON.parse(JSON.stringify(building.rooms)));
            }
            const idx = building.rooms.indexOf(room);
            if (idx >= 0) building.rooms.splice(idx, 1);
            autosaveDraft();
            if (splitMode) {
              generateGrid();
              updateSplitVisuals();
              renderRoomList(building);
              showHint(`Deleted room "${room.name}". Cells unlocked.`);
            } else {
              rebuildCampus(CAMPUS_DATA);
              selectBuilding(building);
            }
          });
          div.appendChild(delBtn);

          editRoomListEl.appendChild(div);
        });
      }

      // --- Grid-Select Room Tool Functions ---
      const splitOverlay = document.getElementById('splitOverlay');
      const splitToolbar = document.getElementById('splitToolbar');
      const splitLevelSelect = document.getElementById('splitLevelSelect');
      const splitGridSizeInput = document.getElementById('splitGridSize');
      const splitRegenBtn = document.getElementById('splitRegenBtn');
      const splitCreateRoomBtn = document.getElementById('splitCreateRoomBtn');
      const splitUndoBtn = document.getElementById('splitUndoBtn');
      const splitDoneBtn = document.getElementById('splitDoneBtn');

      function clearSplitVisuals() {
        splitVisualMeshes.forEach(m => {
          scene.remove(m);
          if (m.geometry) m.geometry.dispose();
          if (m.material) m.material.dispose();
        });
        splitVisualMeshes = [];
      }

      function generateGrid() {
        if (!splitBuilding) return;
        ensureFootprint(splitBuilding);
        const fp = splitBuilding.footprint;
        const bounds = footprintBounds(fp);
        const cellSize = Math.max(0.5, parseFloat(splitGridSizeInput.value) || 2);

        splitGridCells = [];
        splitSelectedCells.clear();

        // Existing rooms on the selected level
        const currentLevelRooms = (splitBuilding.rooms || []).filter(r =>
          (r.floor !== undefined ? r.floor : 1) === splitCurrentLevel && r.footprint && r.footprint.length >= 3
        );

        let cellId = 0;
        for (let x = bounds.minX; x < bounds.maxX; x += cellSize) {
          for (let z = bounds.minZ; z < bounds.maxZ; z += cellSize) {
            const minX = x, maxX = Math.min(x + cellSize, bounds.maxX);
            const minZ = z, maxZ = Math.min(z + cellSize, bounds.maxZ);

            // Create initial cell polygon
            const cellBox = [[minX, minZ], [maxX, minZ], [maxX, maxZ], [minX, maxZ]];
            // Clip cellBox against building footprint
            const clippedPoly = clipPolygonAgainstBox(fp, minX, maxX, minZ, maxZ);

            if (clippedPoly.length >= 3) {
              const area = polygonArea(clippedPoly);
              if (area >= 0.1) {
                // Check if this cell is inside any room on the selected level
                const center = [(minX + maxX) / 2, (minZ + maxZ) / 2];
                let isLocked = false;
                for (const rm of currentLevelRooms) {
                  if (pointInPolygon(center, rm.footprint)) {
                    isLocked = true;
                    break;
                  }
                }

                splitGridCells.push({
                  id: cellId++,
                  minX, maxX, minZ, maxZ,
                  polygon: clippedPoly,
                  isLocked: isLocked
                });
              }
            }
          }
        }
      }

      function updateSplitVisuals() {
        clearSplitVisuals();
        if (!splitBuilding) return;
        const b = splitBuilding;
        const rot = THREE.MathUtils.degToRad(b.rotation || 0);

        // 1. Render all existing rooms on this level with distinct colors
        const levelRooms = (b.rooms || []).filter(r => (r.floor !== undefined ? r.floor : 1) === splitCurrentLevel);
        levelRooms.forEach((room, ri) => {
          if (!room.footprint || room.footprint.length < 3) return;
          const shape = new THREE.Shape();
          shape.moveTo(room.footprint[0][0], -room.footprint[0][1]);
          for (let i = 1; i < room.footprint.length; i++) shape.lineTo(room.footprint[i][0], -room.footprint[i][1]);
          shape.closePath();

          const geo = new THREE.ShapeGeometry(shape);
          geo.rotateX(-Math.PI / 2);
          const color = ROOM_COLORS[ri % ROOM_COLORS.length];
          const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(b.x, 0.16, b.z);
          mesh.rotation.y = rot;
          mesh.renderOrder = 996;
          scene.add(mesh);
          splitVisualMeshes.push(mesh);
        });

        // 2. Render grid cells
        splitGridCells.forEach(cell => {
          const isSelected = splitSelectedCells.has(cell.id);
          const poly = cell.polygon;
          if (!poly || poly.length < 3) return;

          // Wireframe outline
          const edgePts = [];
          poly.forEach(p => edgePts.push(p[0], 0, -p[1]));
          edgePts.push(poly[0][0], 0, -poly[0][1]); // close loop
          const lineGeo = new THREE.BufferGeometry();
          lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePts, 3));

          let lineColor = 0x00ffff;
          let lineOpacity = 0.3;
          if (cell.isLocked) {
            lineColor = 0x555555;
            lineOpacity = 0.2;
          } else if (isSelected) {
            lineColor = 0xffff00;
            lineOpacity = 0.9;
          }

          const lineMat = new THREE.LineBasicMaterial({ color: lineColor, transparent: true, opacity: lineOpacity, depthTest: false });
          const line = new THREE.Line(lineGeo, lineMat);
          line.position.set(b.x, 0.18, b.z);
          line.rotation.y = rot;
          line.renderOrder = 998;
          scene.add(line);
          splitVisualMeshes.push(line);

          // Fill for cell
          let fillColor = null;
          let fillOpacity = 0;
          if (cell.isLocked) {
            fillColor = 0x334444;
            fillOpacity = 0.15;
          } else if (isSelected) {
            fillColor = 0xffff00;
            fillOpacity = 0.45;
          }

          if (fillColor !== null) {
            const shape = new THREE.Shape();
            shape.moveTo(poly[0][0], -poly[0][1]);
            for (let i = 1; i < poly.length; i++) shape.lineTo(poly[i][0], -poly[i][1]);
            shape.closePath();

            const geo = new THREE.ShapeGeometry(shape);
            geo.rotateX(-Math.PI / 2);
            const mat = new THREE.MeshBasicMaterial({ color: fillColor, transparent: true, opacity: fillOpacity, side: THREE.DoubleSide, depthWrite: false });
            const fill = new THREE.Mesh(geo, mat);
            fill.position.set(b.x, 0.17, b.z);
            fill.rotation.y = rot;
            fill.renderOrder = 997;
            scene.add(fill);
            splitVisualMeshes.push(fill);
          }
        });
      }

      function enterSplitMode(building) {
        if (splitMode) return;
        splitMode = true;
        splitBuilding = building;
        ensureFootprint(building);

        splitHistory = [];
        splitSelectedCells.clear();

        // Populate Level dropdown
        splitLevelSelect.innerHTML = '';
        const totalLevels = Math.max(1, building.levels || 1);
        for (let l = 1; l <= totalLevels; l++) {
          const opt = document.createElement('option');
          opt.value = l;
          opt.textContent = `Level ${l}`;
          splitLevelSelect.appendChild(opt);
        }
        splitCurrentLevel = 1;
        splitLevelSelect.value = 1;

        // Save camera and frame the building
        splitSavedCamera = { pos: camera.position.clone(), target: controls.target.clone() };
        const bounds = footprintBounds(building.footprint);
        const c = polygonCentroid(building.footprint);
        const rot = THREE.MathUtils.degToRad(building.rotation || 0);
        const wcx = building.x + Math.cos(rot) * c[0] - Math.sin(rot) * c[1];
        const wcz = building.z + Math.sin(rot) * c[0] + Math.cos(rot) * c[1];
        const viewSize = Math.max(bounds.w, bounds.d) + 8;
        controls.target.set(wcx, 0, wcz);
        camera.position.set(wcx, viewSize * 1.2, wcz + 0.01);
        controls.update();

        // Dim background & show split UI
        splitOverlay.classList.add('visible');
        splitToolbar.classList.add('visible');
        editBuildingForm.style.display = 'block';
        editRoadForm.style.display = 'none';
        editFormDiv.classList.add('visible');
        document.getElementById('editToolbar').style.display = 'none';

        // Dim all buildings
        buildingGroups.forEach(g => {
          g.traverse(child => {
            if (child.material && child !== satPlane) {
              if (!child.userData._origOpacity) child.userData._origOpacity = child.material.opacity;
              child.material.opacity = child.userData._origOpacity * 0.15;
            }
          });
        });

        generateGrid();
        updateSplitVisuals();
        renderRoomList(building);
        showHint('Click & drag over grid cells to select. Click "Create Room" to merge.');
      }

      function exitSplitMode() {
        if (!splitMode) return;

        // Restore building opacities
        buildingGroups.forEach(g => {
          g.traverse(child => {
            if (child.material && child.userData._origOpacity !== undefined) {
              child.material.opacity = child.userData._origOpacity;
              delete child.userData._origOpacity;
            }
          });
        });

        clearSplitVisuals();
        splitOverlay.classList.remove('visible');
        splitToolbar.classList.remove('visible');
        document.getElementById('editToolbar').style.display = 'flex';

        if (splitSavedCamera) {
          camera.position.copy(splitSavedCamera.pos);
          controls.target.copy(splitSavedCamera.target);
          controls.update();
        }

        const b = splitBuilding;
        splitMode = false;
        splitBuilding = null;
        splitGridCells = [];
        splitSelectedCells.clear();
        splitHistory = [];

        if (b) {
          rebuildCampus(CAMPUS_DATA);
          autosaveDraft();
          selectBuilding(b);
        }
        showHint('');
      }

      function handleCellToggleAtLocal(lx, lz, forceMode = null) {
        // Find cell containing (lx, lz)
        const cell = splitGridCells.find(c => pointInPolygon([lx, lz], c.polygon));
        if (!cell || cell.isLocked) return null;

        const isCurrentlySelected = splitSelectedCells.has(cell.id);
        const shouldSelect = forceMode !== null ? forceMode : !isCurrentlySelected;

        if (shouldSelect) {
          splitSelectedCells.add(cell.id);
        } else {
          splitSelectedCells.delete(cell.id);
        }

        updateSplitVisuals();
        return shouldSelect;
      }

      function createRoomFromSelection() {
        if (splitSelectedCells.size === 0) {
          showHint('Select at least one cell first.');
          return;
        }

        const selectedPolys = [];
        splitGridCells.forEach(cell => {
          if (splitSelectedCells.has(cell.id)) {
            selectedPolys.push(cell.polygon);
          }
        });

        const mergedFootprint = unionCellPolygons(selectedPolys);
        if (!mergedFootprint || mergedFootprint.length < 3) {
          showHint('Failed to form a valid room polygon from selection.');
          return;
        }

        // Prompt for room name & type
        const totalRooms = (splitBuilding.rooms || []).length + 1;
        const defaultName = `Room ${totalRooms}`;
        const name = prompt('Room name:', defaultName) || defaultName;
        const typeChoice = prompt(`Room type (${ROOM_TYPES.join(', ')}):`, 'classroom') || 'classroom';
        const type = ROOM_TYPES.includes(typeChoice.toLowerCase()) ? typeChoice.toLowerCase() : 'classroom';

        // Save undo state
        splitHistory.push(JSON.parse(JSON.stringify(splitBuilding.rooms || [])));

        if (!splitBuilding.rooms) splitBuilding.rooms = [];
        const newRoom = {
          id: `${splitBuilding.id}-r${Date.now() % 100000}`,
          name: name.trim(),
          type: type,
          floor: splitCurrentLevel,
          footprint: mergedFootprint.map(p => [Math.round(p[0] * 100) / 100, Math.round(p[1] * 100) / 100])
        };

        splitBuilding.rooms.push(newRoom);
        autosaveDraft();

        splitSelectedCells.clear();
        generateGrid();
        updateSplitVisuals();
        renderRoomList(splitBuilding);
        showHint(`Created "${newRoom.name}" on Level ${splitCurrentLevel}!`);
      }

      // Event listener: Level change
      splitLevelSelect.addEventListener('change', () => {
        if (splitSelectedCells.size > 0) {
          alert('Discarding unapplied cell selection for this level.');
          splitSelectedCells.clear();
        }
        splitCurrentLevel = parseInt(splitLevelSelect.value) || 1;
        generateGrid();
        updateSplitVisuals();
        renderRoomList(splitBuilding);
        showHint(`Viewing Level ${splitCurrentLevel}`);
      });

      // Event listener: Regenerate grid
      splitRegenBtn.addEventListener('click', () => {
        generateGrid();
        updateSplitVisuals();
        showHint('Grid regenerated.');
      });

      // Event listener: Create room
      splitCreateRoomBtn.addEventListener('click', () => {
        createRoomFromSelection();
      });

      // Event listener: Undo
      splitUndoBtn.addEventListener('click', () => {
        if (splitHistory.length === 0) {
          showHint('Nothing to undo.');
          return;
        }
        splitBuilding.rooms = splitHistory.pop();
        autosaveDraft();
        splitSelectedCells.clear();
        generateGrid();
        updateSplitVisuals();
        renderRoomList(splitBuilding);
        showHint('Action undone.');
      });

      // Event listener: Done
      splitDoneBtn.addEventListener('click', () => {
        exitSplitMode();
      });

      // Wire up split button in building inspector
      document.getElementById('splitRoomsBtn').addEventListener('click', () => {
        if (!editorSelected || editorSelected.type !== 'building') return;
        enterSplitMode(editorSelected.data);
      });

      // --- Form input handlers ---
      ['editId', 'editName'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
          if (!editorSelected || editorSelected.type !== 'building') return;
          const b = editorSelected.data;
          b.id = document.getElementById('editId').value;
          b.name = document.getElementById('editName').value;
          rebuildCampus(CAMPUS_DATA);
          autosaveDraft();
          selectBuilding(b);
        });
      });
      document.getElementById('editLevels').addEventListener('change', () => {
        if (!editorSelected || editorSelected.type !== 'building') return;
        editorSelected.data.levels = Math.max(1, parseInt(document.getElementById('editLevels').value) || 1);
        rebuildCampus(CAMPUS_DATA);
        autosaveDraft();
        selectBuilding(editorSelected.data);
      });
      document.getElementById('editLevelHeight').addEventListener('change', () => {
        if (!editorSelected || editorSelected.type !== 'building') return;
        editorSelected.data.levelHeight = Math.max(0.5, parseFloat(document.getElementById('editLevelHeight').value) || 3.2);
        rebuildCampus(CAMPUS_DATA);
        autosaveDraft();
        selectBuilding(editorSelected.data);
      });
      document.getElementById('editRotation').addEventListener('change', () => {
        if (!editorSelected || editorSelected.type !== 'building') return;
        editorSelected.data.rotation = parseFloat(document.getElementById('editRotation').value) || 0;
        rebuildCampus(CAMPUS_DATA);
        autosaveDraft();
        selectBuilding(editorSelected.data);
      });
      document.getElementById('editRoadId').addEventListener('change', () => {
        if (!editorSelected || editorSelected.type !== 'road') return;
        editorSelected.data.id = document.getElementById('editRoadId').value;
        autosaveDraft();
      });
      document.getElementById('editRoadWidth').addEventListener('change', () => {
        if (!editorSelected || editorSelected.type !== 'road') return;
        editorSelected.data.width = parseFloat(document.getElementById('editRoadWidth').value) || 6;
        rebuildCampus(CAMPUS_DATA);
        autosaveDraft();
        selectRoad(editorSelected.data);
      });

      // --- Editor mouse interaction ---
      let lastClickTime = 0;

      renderer.domElement.addEventListener('pointerdown', (e) => {
        if (!editActive || e.button !== 0) return;
        if (e.target !== renderer.domElement) return;

        const mx = (e.clientX / window.innerWidth) * 2 - 1;
        const my = -(e.clientY / window.innerHeight) * 2 + 1;
        const now = performance.now();
        const isDouble = (now - lastClickTime) < 350;
        lastClickTime = now;

        const gp = getGroundPoint(mx, my);
        if (!gp) return;

        // Split mode: click or drag-select cells
        if (splitMode && splitBuilding) {
          splitIsPointerDown = true;
          controls.enabled = false;
          const lp = worldToLocal(gp.x, gp.z, splitBuilding);
          const mode = handleCellToggleAtLocal(lp[0], lp[1]);
          if (mode !== null) {
            splitDragSelectMode = mode;
          }
          return;
        }

        // Drawing mode
        if (editorDrawMode) {
          if (isDouble) {
            if (editorDrawMode === 'building') finishDrawBuilding();
            else finishDrawRoad();
            return;
          }
          drawPoints.push([gp.x, gp.z]);
          updateDrawPreview();
          return;
        }

        // Select mode: check handles first, then buildings, then roads
        raycaster.setFromCamera(new THREE.Vector2(mx, my), camera);

        // Check rotation handle
        if (editorRotHandle) {
          const rh = raycaster.intersectObject(editorRotHandle);
          if (rh.length > 0) {
            const b = editorSelected.data;
            const c = polygonCentroid(b.footprint);
            const rot = THREE.MathUtils.degToRad(b.rotation || 0);
            const wcx = b.x + Math.cos(rot) * c[0] - Math.sin(rot) * c[1];
            const wcz = b.z + Math.sin(rot) * c[0] + Math.cos(rot) * c[1];
            editorDrag = { type: 'rotate', startAngle: b.rotation || 0, centerX: wcx, centerZ: wcz };
            controls.enabled = false;
            return;
          }
        }

        // Check vertex handles
        if (editorHandles.length > 0) {
          const hits = raycaster.intersectObjects(editorHandles);
          if (hits.length > 0) {
            const vi = hits[0].object.userData.vertexIndex;
            editorDrag = { type: 'vertex', vertexIndex: vi, startWorld: gp.clone() };
            controls.enabled = false;
            return;
          }
        }

        // Check buildings
        if (buildingMeshes.length > 0) {
          const hits = raycaster.intersectObjects(buildingMeshes);
          if (hits.length > 0) {
            const b = hits[0].object.userData.building;
            selectBuilding(b);
            editorDrag = { type: 'move', startWorld: gp.clone(), startX: b.x, startZ: b.z, moved: false };
            controls.enabled = false;
            return;
          }
        }

        // Check roads (use roadMeshes)
        if (roadMeshes.length > 0) {
          const hits = raycaster.intersectObjects(roadMeshes);
          if (hits.length > 0) {
            const r = hits[0].object.userData.road;
            selectRoad(r);
            return;
          }
        }

        // Clicked empty space
        clearEditorSelection();
      });

      renderer.domElement.addEventListener('pointermove', (e) => {
        if (!editActive) return;
        const mx = (e.clientX / window.innerWidth) * 2 - 1;
        const my = -(e.clientY / window.innerHeight) * 2 + 1;

        // Split mode drag-selection
        if (splitMode && splitBuilding) {
          if (splitIsPointerDown) {
            const gp = getGroundPoint(mx, my);
            if (gp) {
              const lp = worldToLocal(gp.x, gp.z, splitBuilding);
              handleCellToggleAtLocal(lp[0], lp[1], splitDragSelectMode);
            }
          }
          return;
        }

        // Drawing preview
        if (editorDrawMode && drawPoints.length > 0) {
          const gp = getGroundPoint(mx, my);
          if (gp) updateDrawPreview([gp.x, gp.z]);
          return;
        }

        // Dragging
        if (!editorDrag || !editorSelected) return;
        const gp = getGroundPoint(mx, my);
        if (!gp) return;

        if (editorDrag.type === 'move' && editorSelected.type === 'building') {
          const dx = gp.x - editorDrag.startWorld.x;
          const dz = gp.z - editorDrag.startWorld.z;
          if (Math.abs(dx) > 0.3 || Math.abs(dz) > 0.3) editorDrag.moved = true;
          editorSelected.data.x = editorDrag.startX + dx;
          editorSelected.data.z = editorDrag.startZ + dz;
          rebuildCampus(CAMPUS_DATA);
          // Update handles (no full re-select during drag for perf)
          const b = editorSelected.data;
          const rot = THREE.MathUtils.degToRad(b.rotation || 0);
          const cosR = Math.cos(rot), sinR = Math.sin(rot);
          editorHandles.forEach((h, i) => {
            if (i < b.footprint.length) {
              const v = b.footprint[i];
              h.position.set(b.x + cosR * v[0] - sinR * v[1], 0.5, b.z + sinR * v[0] + cosR * v[1]);
            }
          });
          if (editorRotHandle) {
            const c = polygonCentroid(b.footprint);
            const bounds = footprintBounds(b.footprint);
            const rd = Math.max(bounds.w, bounds.d) / 2 + 4;
            editorRotHandle.position.set(
              b.x + cosR * (c[0] + rd) - sinR * c[1], 0.5,
              b.z + sinR * (c[0] + rd) + cosR * c[1]
            );
          }
        } else if (editorDrag.type === 'vertex') {
          const vi = editorDrag.vertexIndex;
          if (editorSelected.type === 'building') {
            const b = editorSelected.data;
            // World to local
            const rot = THREE.MathUtils.degToRad(b.rotation || 0);
            const cosR = Math.cos(-rot), sinR = Math.sin(-rot);
            const lx = cosR * (gp.x - b.x) - sinR * (gp.z - b.z);
            const lz = sinR * (gp.x - b.x) + cosR * (gp.z - b.z);
            b.footprint[vi] = [lx, lz];
            rebuildCampus(CAMPUS_DATA);
            selectBuilding(b);
          } else if (editorSelected.type === 'road') {
            const r = editorSelected.data;
            r.path[vi] = [gp.x, gp.z];
            rebuildCampus(CAMPUS_DATA);
            selectRoad(r);
          }
        } else if (editorDrag.type === 'rotate') {
          const angle = Math.atan2(gp.z - editorDrag.centerZ, gp.x - editorDrag.centerX);
          editorSelected.data.rotation = Math.round(THREE.MathUtils.radToDeg(-angle));
          rebuildCampus(CAMPUS_DATA);
          selectBuilding(editorSelected.data);
        }
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        if (!editActive) return;
        if (splitMode) {
          splitIsPointerDown = false;
          controls.enabled = true;
          return;
        }
        if (editorDrag) {
          controls.enabled = true;
          if (editorDrag.type === 'move' && editorDrag.moved) {
            autosaveDraft();
            selectBuilding(editorSelected.data);
          } else if (editorDrag.type === 'vertex' || editorDrag.type === 'rotate') {
            autosaveDraft();
          }
          editorDrag = null;
        }
      });

      // --- Keyboard: Enter to finish draw, Delete to remove, Escape to cancel ---
      document.addEventListener('keydown', (e) => {
        if (!editActive) return;
        // Don't intercept keyboard when typing in form inputs
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

        if (e.key === 'Enter') {
          if (splitMode) {
            createRoomFromSelection();
            return;
          }
          if (editorDrawMode === 'building') finishDrawBuilding();
          else if (editorDrawMode === 'road') finishDrawRoad();
        } else if (e.key === 'Escape') {
          if (splitMode) {
            if (splitSelectedCells.size > 0) {
              splitSelectedCells.clear();
              updateSplitVisuals();
              showHint('Cleared cell selection.');
            } else {
              exitSplitMode();
            }
            return;
          }
          cancelDraw();
          showHint('Drawing cancelled');
        } else if ((e.key === 'Delete' || e.key === 'Backspace') && editorSelected) {
          if (editorSelected.type === 'building') {
            CAMPUS_DATA.buildings.splice(editorSelected.index, 1);
          } else if (editorSelected.type === 'road') {
            CAMPUS_DATA.roads.splice(editorSelected.index, 1);
          }
          clearEditorSelection();
          rebuildCampus(CAMPUS_DATA);
          autosaveDraft();
          showHint('Deleted');
        }
      });

      // --- Export / Import / Reset ---
      document.getElementById('exportBtn').addEventListener('click', () => {
        const json = JSON.stringify(CAMPUS_DATA, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'campus.json';
        a.click();
        URL.revokeObjectURL(a.href);
        showHint('Exported campus.json');
      });

      document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('importFile').click();
      });

      document.getElementById('importFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!data.buildings) throw new Error('No buildings array');
            rebuildCampus(data);
            autosaveDraft();
            clearEditorSelection();
            showHint('Imported!');
          } catch (err) {
            showHint('Import error: ' + err.message);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        if (!confirm('Clear draft and reload from campus.json? This cannot be undone.')) return;
        localStorage.removeItem(DRAFT_KEY);
        location.reload();
      });
    }

    // --- Post-processing ---
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.3, 0.4, 0.85
    );
    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      updateFlyAnimation();
      controls.update();
      composer.render();
      labelRenderer.render(scene, camera);
    }

    // Start
    (async () => {
      await loadCampus();
      animate();
    })();
  </script>
</body>
</html>
