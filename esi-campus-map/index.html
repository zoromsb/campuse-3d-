<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus 3D Viewer (Serverless)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    .building-label {
      background: rgba(0, 20, 30, 0.9);
      border: 1px solid #00ffff;
      border-radius: 4px;
      padding: 6px 12px;
      font-family: 'Monospace', monospace;
      font-size: 13px;
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff, 0 0 16px #00ffff;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
    }
    .building-label::before { content: '\25C6 '; color: #00ffff; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffff; font-family: monospace; font-size: 16px; text-shadow: 0 0 10px #00ffff; }
    .side-panel { position: fixed; top: 0; right: 0; width: 320px; height: 100vh; background: linear-gradient(180deg, #0a1520 0%, #050a10 100%); border-left: 1px solid #00ffff33; box-shadow: -4px 0 24px rgba(0, 0, 0, 0.8), inset 1px 0 0 #00ffff22; transform: translateX(100%); transition: transform 0.3s ease; z-index: 100; display: flex; flex-direction: column; overflow: hidden; }
    .side-panel.open { transform: translateX(0); }
    .panel-header { padding: 16px 20px; border-bottom: 1px solid #00ffff33; display: flex; justify-content: space-between; align-items: center; background: rgba(0, 255, 255, 0.03); }
    .panel-title { font-family: 'Monospace', monospace; font-size: 14px; color: #00ffff; text-transform: uppercase; letter-spacing: 1px; }
    .panel-close { background: none; border: 1px solid #00ffff44; color: #00ffff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 12px; transition: all 0.2s; }
    .panel-close:hover { background: rgba(0, 255, 255, 0.1); border-color: #00ffff; box-shadow: 0 0 12px rgba(0, 255, 255, 0.3); }
    .panel-content { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .building-info { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #00ffff22; }
    .building-name { font-size: 18px; font-weight: 600; color: #00ffff; margin-bottom: 4px; text-shadow: 0 0 8px #00ffff; }
    .building-meta { font-size: 12px; color: #00ffff99; font-family: monospace; }
    .rooms-list { display: flex; flex-direction: column; gap: 8px; }
    .room-item { background: rgba(0, 255, 255, 0.04); border: 1px solid #00ffff11; border-radius: 6px; padding: 12px 16px; transition: all 0.2s; cursor: default; }
    .room-item:hover { border-color: #00ffff44; background: rgba(0, 255, 255, 0.08); box-shadow: 0 0 12px rgba(0, 255, 255, 0.1); }
    .room-item.highlighted { border-color: #00ffff; background: rgba(0, 255, 255, 0.15); box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); animation: highlight-pulse 1s ease-in-out 3; }
    @keyframes highlight-pulse { 0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); } 50% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.7); } }
    .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .room-name { font-size: 14px; font-weight: 500; color: #e0ffff; }
    .room-type { font-size: 11px; text-transform: uppercase; color: #00ffff; background: rgba(0, 255, 255, 0.1); padding: 2px 8px; border-radius: 3px; font-family: monospace; letter-spacing: 0.5px; }
    .room-id { font-size: 11px; color: #00ffff66; font-family: monospace; }
    .empty-state { color: #00ffff44; font-style: italic; text-align: center; padding: 40px 20px; }
    .panel-hint { position: fixed; bottom: 24px; left: 24px; color: #00ffff66; font-size: 12px; font-family: monospace; pointer-events: none; opacity: 0.7; }
    .search-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200; width: 400px; max-width: 90vw; }
    .search-input { width: 100%; padding: 12px 16px; background: rgba(0, 20, 30, 0.9); border: 1px solid #00ffff44; border-radius: 6px; color: #00ffff; font-family: 'Monospace', monospace; font-size: 14px; outline: none; transition: all 0.2s; box-shadow: 0 0 12px rgba(0, 0, 0, 0.5); }
    .search-input::placeholder { color: #00ffff66; }
    .search-input:focus { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
    .search-dropdown { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: rgba(0, 15, 25, 0.95); border: 1px solid #00ffff33; border-radius: 6px; max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8); }
    .search-dropdown.visible { display: block; }
    .search-result { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #00ffff11; transition: background 0.15s; }
    .search-result:last-child { border-bottom: none; }
    .search-result:hover { background: rgba(0, 255, 255, 0.08); }
    .search-result-type { font-size: 10px; text-transform: uppercase; color: #00ffff66; font-family: monospace; letter-spacing: 0.5px; margin-bottom: 2px; }
    .search-result-name { font-size: 14px; color: #e0ffff; }
    .search-result-building { font-size: 11px; color: #00ffff99; margin-top: 2px; }
    .search-no-results { padding: 16px; color: #00ffff44; font-style: italic; text-align: center; font-size: 13px; }
    /* Satellite underlay controls */
    .sat-toggle { position: fixed; bottom: 24px; right: 24px; z-index: 200; background: rgba(0,20,30,0.9); border: 1px solid #00ffff44; color: #00ffff; padding: 8px 14px; border-radius: 6px; font-family: monospace; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .sat-toggle:hover, .sat-toggle.active { border-color: #00ffff; box-shadow: 0 0 12px rgba(0,255,255,0.3); background: rgba(0,255,255,0.1); }
    .sat-calibration { position: fixed; bottom: 60px; right: 24px; z-index: 200; background: rgba(0,15,25,0.95); border: 1px solid #00ffff33; border-radius: 6px; padding: 14px 16px; display: none; flex-direction: column; gap: 8px; min-width: 230px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); }
    .sat-calibration.visible { display: flex; }
    .sat-calibration label { font-family: monospace; font-size: 11px; color: #00ffff99; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .sat-calibration input[type=range] { flex: 1; accent-color: #00ffff; }
    .sat-calibration .val { color: #00ffff; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
    /* Level Editor */
    .edit-toolbar { position: fixed; top: 20px; left: 20px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
    .edit-btn { background: rgba(0,20,30,0.9); border: 1px solid #00ffff44; color: #00ffff; padding: 7px 12px; border-radius: 5px; font-family: monospace; font-size: 12px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .edit-btn:hover { border-color: #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
    .edit-btn.active { background: rgba(0,255,255,0.15); border-color: #00ffff; box-shadow: 0 0 12px rgba(0,255,255,0.4); }
    .edit-btn.danger { border-color: #ff444444; color: #ff6666; }
    .edit-btn.danger:hover { border-color: #ff4444; box-shadow: 0 0 10px rgba(255,68,68,0.3); }
    .edit-tools { display: flex; flex-direction: column; gap: 4px; padding: 8px; background: rgba(0,15,25,0.95); border: 1px solid #00ffff33; border-radius: 6px; }
    .edit-tools-row { display: flex; gap: 4px; }
    .edit-form { position: fixed; top: 20px; left: 220px; z-index: 200; background: rgba(0,15,25,0.95); border: 1px solid #00ffff33; border-radius: 6px; padding: 14px 16px; display: none; flex-direction: column; gap: 8px; min-width: 200px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); }
    .edit-form.visible { display: flex; }
    .edit-form label { font-family: monospace; font-size: 11px; color: #00ffff99; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .edit-form input[type=text], .edit-form input[type=number] { background: rgba(0,20,30,0.9); border: 1px solid #00ffff44; border-radius: 4px; color: #00ffff; padding: 4px 8px; font-family: monospace; font-size: 12px; width: 100px; outline: none; }
    .edit-form input:focus { border-color: #00ffff; }
    .edit-form .info { font-family: monospace; font-size: 11px; color: #00ffff66; }
    .edit-hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; background: rgba(0,20,30,0.9); border: 1px solid #00ffff44; border-radius: 5px; padding: 6px 14px; font-family: monospace; font-size: 12px; color: #00ffff; pointer-events: none; display: none; }
    .edit-hint.visible { display: block; }
    /* Split mode */
    .split-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 150; pointer-events: none; display: none; }
    .split-overlay.visible { display: block; }
    .split-toolbar { position: fixed; top: 20px; right: 24px; z-index: 210; display: none; flex-direction: column; gap: 8px; background: rgba(0,15,25,0.95); border: 1px solid #00ffff33; border-radius: 6px; padding: 12px 14px; min-width: 220px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); }
    .split-toolbar.visible { display: flex; }
    .split-toolbar label { font-family: monospace; font-size: 11px; color: #00ffff99; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .split-toolbar input[type=number], .split-toolbar input[type=text], .split-toolbar select { background: rgba(0,20,30,0.9); border: 1px solid #00ffff44; border-radius: 4px; color: #00ffff; padding: 4px 6px; font-family: monospace; font-size: 11px; outline: none; width: 90px; }
    .split-toolbar .split-btn-row { display: flex; gap: 6px; }
    .split-toolbar .split-btn-row .edit-btn { flex: 1; text-align: center; }
    .room-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    .room-entry { background: rgba(0,255,255,0.05); border: 1px solid #00ffff22; border-radius: 4px; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; position: relative; }
    .room-entry label { font-size: 10px; }
    .room-entry input { width: 80px; }
    .room-entry select { background: rgba(0,20,30,0.9); border: 1px solid #00ffff44; border-radius: 4px; color: #00ffff; padding: 2px 6px; font-family: monospace; font-size: 11px; outline: none; }
    .room-entry .room-del-btn { background: rgba(255,50,50,0.15); border: 1px solid #ff444455; color: #ff6666; border-radius: 3px; padding: 2px 6px; font-size: 10px; cursor: pointer; align-self: flex-end; margin-top: 2px; }
    .room-entry .room-del-btn:hover { background: rgba(255,50,50,0.3); border-color: #ff6666; }
  </style>
</head>
<body>
  <div class="loading" id="loading">LOADING CAMPUS DATA...</div>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" class="search-input" id="searchInput" placeholder="Search buildings or rooms..." autocomplete="off">
    <div class="search-dropdown" id="searchDropdown"></div>
  </div>

  <!-- Side Panel -->
  <div class="side-panel" id="sidePanel">
    <div class="panel-header">
      <span class="panel-title" id="panelTitle">BUILDING DETAILS</span>
      <button class="panel-close" id="panelClose">CLOSE</button>
    </div>
    <div class="panel-content" id="panelContent">
      <div class="empty-state">Click a building to view rooms</div>
    </div>
  </div>

  <div class="panel-hint">Click a building to inspect</div>

  <!-- Satellite underlay controls -->
  <button class="sat-toggle" id="satToggle" title="Toggle satellite underlay" style="display:none">🛰 SAT</button>
  <div class="sat-calibration" id="satCalibration">
    <label>Width <input type="range" id="satWidth" min="50" max="400" step="1"><span class="val" id="satWidthVal"></span></label>
    <label>Depth <input type="range" id="satDepth" min="50" max="400" step="1"><span class="val" id="satDepthVal"></span></label>
    <label>Offset X <input type="range" id="satOffX" min="-100" max="100" step="0.5"><span class="val" id="satOffXVal"></span></label>
    <label>Offset Z <input type="range" id="satOffZ" min="-100" max="100" step="0.5"><span class="val" id="satOffZVal"></span></label>
    <label>Rotation° <input type="range" id="satRot" min="-180" max="180" step="0.5"><span class="val" id="satRotVal"></span></label>
  </div>

  <!-- Level Editor (only visible with ?edit=1) -->
  <div id="editToolbar" class="edit-toolbar" style="display:none">
    <button id="editToggle" class="edit-btn">✏️ EDIT</button>
    <div id="editTools" class="edit-tools" style="display:none">
      <div class="edit-tools-row">
        <button id="selectModeBtn" class="edit-btn active">👆 Select</button>
        <button id="drawBuildingBtn" class="edit-btn">🏢 Building</button>
        <button id="drawRoadBtn" class="edit-btn">🛤️ Road</button>
      </div>
      <div class="edit-tools-row">
        <button id="exportBtn" class="edit-btn">💾 Export</button>
        <button id="importBtn" class="edit-btn">📂 Import</button>
        <button id="resetBtn" class="edit-btn danger">🔄 Reset</button>
      </div>
    </div>
  </div>
  <div id="editForm" class="edit-form">
    <div id="editBuildingForm">
      <label>ID <input type="text" id="editId"></label>
      <label>Name <input type="text" id="editName"></label>
      <label>Levels <input type="number" id="editLevels" min="1" step="1"></label>
      <label>Level height <input type="number" id="editLevelHeight" min="0.5" step="0.1"></label>
      <label>Rotation <input type="number" id="editRotation" step="1"></label>
      <div class="info" id="editFpInfo"></div>
      <button id="splitRoomsBtn" class="edit-btn" style="margin-top:4px">✂️ Split Rooms</button>
      <div class="room-list" id="editRoomList"></div>
    </div>
    <div id="editRoadForm" style="display:none">
      <label>ID <input type="text" id="editRoadId"></label>
      <label>Width <input type="number" id="editRoadWidth" min="1" step="0.5"></label>
      <div class="info" id="editPathInfo"></div>
    </div>
  </div>
  <div id="editHint" class="edit-hint"></div>
  <div id="splitOverlay" class="split-overlay"></div>
  <div id="splitToolbar" class="split-toolbar">
    <label>Level <select id="splitLevelSelect"></select></label>
    <label>Grid size <input type="number" id="splitGridSize" value="2" min="0.5" step="0.5"></label>
    <button id="splitRegenBtn" class="edit-btn">🔄 Regenerate grid</button>
    <button id="splitCreateRoomBtn" class="edit-btn" style="border-color:#00ffff;background:rgba(0,255,255,0.15)">➕ Create Room</button>
    <div class="split-btn-row">
      <button id="splitUndoBtn" class="edit-btn">↩ Undo</button>
      <button id="splitDoneBtn" class="edit-btn">✅ Done</button>
    </div>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // Embedded campus data - no server needed!
    let CAMPUS_DATA = {
      "buildings": [
        { "id": "bloc-1",  "name": "Bloc 1",  "x": -65, "z": -10, "width": 18, "depth": 30, "height": 8, "rooms": [] },
        { "id": "bloc-2",  "name": "Bloc 2",  "x": -42, "z": -5,  "width": 8,  "depth": 12, "height": 8, "rooms": [] },
        { "id": "bloc-3",  "name": "Bloc 3",  "x": -32, "z": -5,  "width": 8,  "depth": 10, "height": 8, "rooms": [] },
        { "id": "bloc-4",  "name": "Bloc 4",  "x": -22, "z": -5,  "width": 8,  "depth": 10, "height": 8, "rooms": [] },
        { "id": "bloc-5",  "name": "Bloc 5",  "x": -8,  "z": 2,   "width": 12, "depth": 14, "height": 8, "rooms": [] },
        { "id": "bloc-6",  "name": "Bloc 6",  "x": 10,  "z": -18, "width": 22, "depth": 10, "height": 8, "rooms": [] },
        { "id": "bloc-7",  "name": "Bloc 7",  "x": 18,  "z": -6,  "width": 20, "depth": 14, "height": 8, "rooms": [] },
        { "id": "bloc-8",  "name": "Bloc 8",  "x": 35,  "z": -14, "width": 10, "depth": 18, "height": 8, "rooms": [] },
        { "id": "bloc-9",  "name": "Bloc 9",  "x": 42,  "z": -6,  "width": 8,  "depth": 10, "height": 8, "rooms": [] },
        { "id": "bloc-10", "name": "Bloc 10", "x": 18,  "z": 10,  "width": 16, "depth": 8,  "height": 8, "rooms": [] },
        { "id": "bloc-11", "name": "Bloc 11", "x": 34,  "z": 8,   "width": 12, "depth": 14, "height": 8, "rooms": [] },
        { "id": "bloc-12", "name": "Bloc 12", "x": 50,  "z": 2,   "width": 10, "depth": 20, "height": 8, "rooms": [] },
        { "id": "bloc-13", "name": "Bloc 13", "x": 10,  "z": 22,  "width": 14, "depth": 12, "height": 8, "rooms": [] },
        { "id": "bloc-14", "name": "Bloc 14", "x": 28,  "z": 22,  "width": 10, "depth": 10, "height": 8, "rooms": [] }
      ],
      "roads": []
    };

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 30, 50);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 10;
    controls.maxDistance = 200;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;

    const gridHelper = new THREE.GridHelper(200, 40, 0x003333, 0x001111);
    scene.add(gridHelper);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    // --- Dot-Grid Particle Field ---
    function createDotGrid() {
      const gridSize = 200;
      const divisions = 50;
      const step = gridSize / divisions;
      const half = gridSize / 2;
      const dotCount = (divisions + 1) * (divisions + 1);
      const positions = new Float32Array(dotCount * 3);
      let idx = 0;
      for (let i = 0; i <= divisions; i++) {
        for (let j = 0; j <= divisions; j++) {
          positions[idx++] = -half + i * step;
          positions[idx++] = 0.01;
          positions[idx++] = -half + j * step;
        }
      }
      const dotGeometry = new THREE.BufferGeometry();
      dotGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const dotMaterial = new THREE.PointsMaterial({
        color: 0x00ffff,
        size: 0.15,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.4,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const dots = new THREE.Points(dotGeometry, dotMaterial);
      scene.add(dots);
      return dots;
    }
    const dotGrid = createDotGrid();

    // --- Helpers: footprint backward compat + centroid ---
    function ensureFootprint(b) {
      if (!b.footprint) {
        const w = b.width || 10, d = b.depth || 10;
        b.footprint = [[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]];
        delete b.width; delete b.depth;
      }
      if (b.rotation === undefined) b.rotation = 0;
      if (b.levels === undefined && b.levelHeight === undefined) {
        if (b.height !== undefined) {
          b.levels = 1;
          b.levelHeight = Number(b.height) || 8;
        } else {
          b.levels = 1;
          b.levelHeight = 3.2;
        }
      } else {
        if (b.levels === undefined) b.levels = 1;
        if (b.levelHeight === undefined) b.levelHeight = 3.2;
      }
      return b;
    }

    function getBuildingHeight(b) {
      ensureFootprint(b);
      return (Number(b.levels) || 1) * (Number(b.levelHeight) || 3.2);
    }

    function polygonCentroid(fp) {
      let cx = 0, cz = 0;
      for (const [x, z] of fp) { cx += x; cz += z; }
      return [cx / fp.length, cz / fp.length];
    }

    function footprintBounds(fp) {
      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      for (const [x, z] of fp) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
      }
      return { minX, maxX, minZ, maxZ, w: maxX - minX, d: maxZ - minZ };
    }

    // --- Satellite Underlay ---
    const SAT_STORAGE_KEY = 'esi-campus-sat-calibration';
    const satDefaults = { width: 200, depth: 120, offX: 0, offZ: 0, rot: 0 };
    let satCalib = Object.assign({}, satDefaults);
    try {
      const saved = JSON.parse(localStorage.getItem(SAT_STORAGE_KEY));
      if (saved) Object.assign(satCalib, saved);
    } catch (_) {}

    let satPlane = null;
    let satVisible = false;

    function createSatellitePlane() {
      const loader = new THREE.TextureLoader();
      loader.load('assets/satellite.png', (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        const geo = new THREE.PlaneGeometry(1, 1);
        const mat = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 0.55,
          depthWrite: false,
          side: THREE.DoubleSide,
          color: 0x888888          // darkens the image
        });
        satPlane = new THREE.Mesh(geo, mat);
        satPlane.rotation.x = -Math.PI / 2;   // lay flat
        satPlane.position.y = 0.05;            // just above ground
        satPlane.visible = satVisible;
        applySatCalibration();
        scene.add(satPlane);

        console.warn('Could not load satellite.png:', err);
      });

    function applySatCalibration() {

      satPlane.position.z = satCalib.offZ;

    // --- Fuzzy Matching ---
    function fuzzyMatch(query, text) {
      if (!query || !text) return false;
      const q = query.toLowerCase().trim();
      const t = text.toLowerCase();
      if (t.includes(q)) return true;
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    function fuzzyScore(query, text) {
      if (!query || !text) return 0;
      const q = query.toLowerCase().trim();
      const t = text.toLowerCase();
      if (t === q) return 100;
      if (t.startsWith(q)) return 80;
      if (t.includes(q)) return 60;
      let qi = 0, matches = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) { qi++; matches++; }
      }
      if (qi === q.length) return 30 + (matches / t.length) * 20;
      return 0;
    }

    // --- Search Logic ---
    const searchInput = document.getElementById('searchInput');
    const searchDropdown = document.getElementById('searchDropdown');

    function performSearch(query) {
      if (!query || !query.trim()) {
        searchDropdown.classList.remove('visible');
        return;
      }

      const results = [];
      CAMPUS_DATA.buildings.forEach(building => {
        const buildingScore = fuzzyScore(query, building.name);
        if (buildingScore > 0) {
          results.push({
            type: 'building',
            building: building,
            name: building.name,
            score: buildingScore,
            matchedRoom: null
          });
        }
        (building.rooms || []).forEach(room => {
          const roomScore = fuzzyScore(query, room.name);
          if (roomScore > 0) {
            results.push({
              type: 'room',
              building: building,
              name: room.name,
              score: roomScore,
              matchedRoom: room
            });
          }
        });
      });

      results.sort((a, b) => b.score - a.score);

      if (results.length === 0) {
        searchDropdown.innerHTML = '<div class="search-no-results">No matches found</div>';
      } else {
        searchDropdown.innerHTML = results.map((r, i) => `
          <div class="search-result" data-index="${i}">
            <div class="search-result-type">${r.type === 'building' ? 'Building' : 'Room'}</div>
            <div class="search-result-name">${r.name}</div>
            ${r.type === 'room' ? `<div class="search-result-building">in ${r.building.name}</div>` : ''}
          </div>
        `).join('');

        searchDropdown.querySelectorAll('.search-result').forEach((el, i) => {
          el.addEventListener('click', () => {
            selectSearchResult(results[i]);
          });
        });
      }
      searchDropdown.classList.add('visible');
    }

    function selectSearchResult(result) {
      searchDropdown.classList.remove('visible');

      flyToBuilding(result.building);
      openPanel(result.building, result.matchedRoom);

    // --- Camera Fly-to Animation ---
    let flyAnimation = null;
    let activeRoomHighlight = null;

    function flyToBuilding(building) {
      ensureFootprint(building);
      const fp = building.footprint;
      const c = polygonCentroid(fp);
      const rot = THREE.MathUtils.degToRad(building.rotation || 0);
      const cosR = Math.cos(rot), sinR = Math.sin(rot);
      const cx = building.x + cosR * c[0] - sinR * c[1];
      const cz = building.z + sinR * c[0] + cosR * c[1];
      const bounds = footprintBounds(fp);

      const bHeight = getBuildingHeight(building);
      const targetPos = new THREE.Vector3(cx, bHeight / 2, cz);
      const span = Math.max(bounds.w, bounds.d, 10);
      const offset = new THREE.Vector3(span * 0.8, bHeight * 0.6, span * 0.8);
      const endPos = targetPos.clone().add(offset);

      flyAnimation = {
        startPos: camera.position.clone(),
        startTarget: controls.target.clone(),
        endPos: endPos,
        endTarget: targetPos,
        startTime: performance.now(),
        duration: 1200
      };
    }

    function updateFlyAnimation() {
      if (!flyAnimation) return;

      const elapsed = performance.now() - flyAnimation.startTime;
      let t = Math.min(elapsed / flyAnimation.duration, 1);

      t = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

      camera.position.lerpVectors(flyAnimation.startPos, flyAnimation.endPos, t);
      controls.target.lerpVectors(flyAnimation.startTarget, flyAnimation.endTarget, t);
      controls.update();

      if (t >= 1) flyAnimation = null;
    }

    // --- Building Creation (extruded polygon footprint) ---
    function createBuildingMesh(building) {
      ensureFootprint(building);
      const height = getBuildingHeight(building);
      const { footprint, rotation } = building;
      const group = new THREE.Group();
      group.userData = { building, isBuilding: true };

      // Build THREE.Shape from footprint (local coords → shape XY, negate Z for rotation)
      const shape = new THREE.Shape();
      shape.moveTo(footprint[0][0], -footprint[0][1]);
      for (let i = 1; i < footprint.length; i++) {
        shape.lineTo(footprint[i][0], -footprint[i][1]);
      }
      shape.closePath();

      const geometry = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
      geometry.rotateX(-Math.PI / 2); // lay flat: extrusion now goes along +Y

      const edgesGeometry = new THREE.EdgesGeometry(geometry, 1);

      const edgeMaterial = new THREE.LineBasicMaterial({
        color: 0x00ffff, transparent: true, opacity: 0.9
      });
      const edges = new THREE.LineSegments(edgesGeometry, edgeMaterial);
      group.add(edges);

      const fillMaterial = new THREE.MeshBasicMaterial({
        color: 0x00ffff, transparent: true, opacity: 0.08,
        side: THREE.DoubleSide, depthWrite: false
      });
      const fill = new THREE.Mesh(geometry, fillMaterial);
      fill.userData = { building, isBuilding: true };
      group.add(fill);

      const glowMaterial = new THREE.MeshBasicMaterial({
        color: 0x00ffff, transparent: true, opacity: 0.05,
        side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending
      });
      const glow = new THREE.Mesh(geometry.clone(), glowMaterial);
      glow.scale.setScalar(1.02);
      group.add(glow);

      // Position + rotation
      group.position.set(building.x, 0, building.z);
      group.rotation.y = THREE.MathUtils.degToRad(rotation || 0);

      // Label at centroid
      const c = polygonCentroid(footprint);
      const labelHeight = height + 4;
      const lineGeometry = new THREE.BufferGeometry();
      lineGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        c[0], height, c[1],  c[0], labelHeight, c[1]
      ]), 3));
      const connectorLine = new THREE.Line(lineGeometry, new THREE.LineBasicMaterial({
        color: 0x00ffff, transparent: true, opacity: 0.3
      }));
      group.add(connectorLine);

      const labelDiv = document.createElement('div');
      labelDiv.className = 'building-label';
      labelDiv.textContent = building.name.toUpperCase();
      const label = new CSS2DObject(labelDiv);
      label.position.set(c[0], labelHeight + 0.5, c[1]);
      group.add(label);

      registerBuildingMesh(fill);
      return group;
    }

    // --- Road Creation (flat ribbon) ---
    function createRoadMesh(road) {
      const halfW = (road.width || 6) / 2;
      const path = road.path;
      if (!path || path.length < 2) return null;
      const verts = [], idx = [];
      for (let i = 0; i < path.length; i++) {
        let dx, dz;
        if (i < path.length - 1) { dx = path[i+1][0] - path[i][0]; dz = path[i+1][1] - path[i][1]; }
        else { dx = path[i][0] - path[i-1][0]; dz = path[i][1] - path[i-1][1]; }
        const len = Math.hypot(dx, dz) || 1;
        const px = -dz / len, pz = dx / len;
        verts.push(
          path[i][0] + px * halfW, 0.08, path[i][1] + pz * halfW,
          path[i][0] - px * halfW, 0.08, path[i][1] - pz * halfW
        );
      }
      for (let i = 0; i < path.length - 1; i++) {
        const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1;
        idx.push(a, c, b, b, c, d);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        color: 0x888888, transparent: true, opacity: 0.35,
        depthWrite: false, side: THREE.DoubleSide
      }));
      mesh.userData = { road, isRoad: true };
      return mesh;
    }

    // Raycaster setup
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let selectedBuilding = null;
    const buildingMeshes = [];
    const buildingGroups = [];
    const roadMeshes = [];
    let allBuildings = CAMPUS_DATA.buildings;

    function registerBuildingMesh(mesh) {
      buildingMeshes.push(mesh);
    }

    // --- Side Panel Logic ---
    const sidePanel = document.getElementById('sidePanel');
    const panelContent = document.getElementById('panelContent');
    const panelClose = document.getElementById('panelClose');

    function openPanel(building, highlightRoom = null) {
      selectedBuilding = building;
      if (activeRoomHighlight) {
        activeRoomHighlight.traverse(child => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        });
        scene.remove(activeRoomHighlight);
        activeRoomHighlight = null;
      }

      if (highlightRoom && highlightRoom.footprint && highlightRoom.footprint.length >= 3) {
        const shape = new THREE.Shape();
        shape.moveTo(highlightRoom.footprint[0][0], -highlightRoom.footprint[0][1]);
        for (let i = 1; i < highlightRoom.footprint.length; i++) {
          shape.lineTo(highlightRoom.footprint[i][0], -highlightRoom.footprint[i][1]);
        }
        shape.closePath();

        const roomHeight = building.levelHeight || 3.2;
        const floorIndex = (highlightRoom.floor || 1) - 1;

        const geo = new THREE.ExtrudeGeometry(shape, { depth: roomHeight, bevelEnabled: false });
        geo.rotateX(-Math.PI / 2); // Lay flat, extrudes up along +Y
        
        activeRoomHighlight = new THREE.Group();
        
        // Transparent 3D fill
        const mat = new THREE.MeshBasicMaterial({ 
          color: 0xffffff, 
          transparent: true, 
          opacity: 0.35, 
          side: THREE.DoubleSide,
          depthTest: false
        });
        const mesh = new THREE.Mesh(geo, mat);
        activeRoomHighlight.add(mesh);

        // Solid white edges for visibility
        const edgesGeo = new THREE.EdgesGeometry(geo);
        const edgesMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
        const edges = new THREE.LineSegments(edgesGeo, edgesMat);
        activeRoomHighlight.add(edges);

        // Position at correct floor elevation
        activeRoomHighlight.position.set(building.x, floorIndex * roomHeight + 0.05, building.z);
        activeRoomHighlight.rotation.y = THREE.MathUtils.degToRad(building.rotation || 0);
        activeRoomHighlight.renderOrder = 999;
        scene.add(activeRoomHighlight);
      }
      const rooms = building.rooms || [];

      let html = `
        <div class="building-info">

          <div class="building-meta">
            ID: ${building.id} • ${(building.footprint||[]).length} vertices • h=${getBuildingHeight(building).toFixed(1)}m (${building.levels || 1} lvl) • ${rooms.length} room${rooms.length !== 1 ? 's' : ''}
          </div>
        </div>
        <div class="rooms-list">
      `;

      if (rooms.length === 0) {
        html += '<div class="empty-state">No rooms defined</div>';

          html += `

              <div class="room-header">
                <span class="room-name">${room.name}</span>
                <span class="room-type">${room.type}</span>
              </div>
              <div class="room-id">${room.id}</div>
            </div>
          `;
        });
      }

      html += '</div>';
      panelContent.innerHTML = html;
      sidePanel.classList.add('open');

      if (highlightRoom) {
        setTimeout(() => {
          const el = panelContent.querySelector(`[data-room-id="${highlightRoom.id}"]`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
    }

    function closePanel() {
      if (activeRoomHighlight) {
        activeRoomHighlight.traverse(child => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        });
        scene.remove(activeRoomHighlight);
        activeRoomHighlight = null;

      selectedBuilding = null;
      sidePanel.classList.remove('open');
      panelContent.innerHTML = '<div class="empty-state">Click a building to view rooms</div>';

    // --- Mouse Interaction ---
    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    }

    function onClick(event) {
      if (event.target.closest('.side-panel')) return;
      if (event.target.closest('.search-container')) return;
      if (event.target.closest('.sat-toggle') || event.target.closest('.sat-calibration')) return;
      if (event.target.closest('.edit-toolbar') || event.target.closest('.edit-form')) return;

      raycaster.setFromCamera(mouse, camera);
      // Raycast against building fill meshes
      // We need to have collected them during creation
      // We'll rebuild this after creating all meshes
      if (buildingMeshes.length > 0) {
        const intersects = raycaster.intersectObjects(buildingMeshes, false);

        if (intersects.length > 0) {
          const hitMesh = intersects[0].object;
          const building = hitMesh.userData.building;
          openPanel(building);
        } else {
          closePanel();
        }
      }
    }

    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('click', onClick);

    // --- Search Input Events ---
    searchInput.addEventListener('input', (e) => {
      performSearch(e.target.value);
    });

    searchInput.addEventListener('focus', (e) => {
      if (e.target.value) performSearch(e.target.value);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) {
        searchDropdown.classList.remove('visible');
      }
    });

    // --- Rebuild Campus (tear down + recreate from data) ---
    function rebuildCampus(data) {
      // Remove existing building groups from scene
      buildingGroups.forEach(group => {
        group.traverse(child => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
            else child.material.dispose();
          }
          if (child.isCSS2DObject && child.element) child.element.remove();
        });
        scene.remove(group);
      });
      buildingGroups.length = 0;
      buildingMeshes.length = 0;

      // Remove existing roads
      roadMeshes.forEach(m => { if (m.geometry) m.geometry.dispose(); if (m.material) m.material.dispose(); scene.remove(m); });
      roadMeshes.length = 0;

      // Update data references
      CAMPUS_DATA = data;
      if (!CAMPUS_DATA.roads) CAMPUS_DATA.roads = [];
      allBuildings = data.buildings;

      // Backward-compat + rebuild all buildings
      data.buildings.forEach(b => {
        ensureFootprint(b);
        const group = createBuildingMesh(b);
        scene.add(group);
        buildingGroups.push(group);
      });

      // Rebuild roads
      (data.roads || []).forEach(r => {
        const mesh = createRoadMesh(r);
        if (mesh) { scene.add(mesh); roadMeshes.push(mesh); }
      });
    }

    // --- Load Campus Data (draft > campus.json > embedded) ---
    const DRAFT_KEY = 'esi-campus-draft';

    async function loadCampus() {
      // 1. Check localStorage draft first
      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_KEY));
        if (draft && draft.buildings) {
          CAMPUS_DATA = draft;
          console.log('Loaded draft from localStorage');
        }
      } catch (_) {}

      // 2. If no draft, try campus.json
      if (!localStorage.getItem(DRAFT_KEY)) {
        try {
          const res = await fetch('campus.json');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          CAMPUS_DATA = data;
          console.log('Loaded campus.json from server');
        } catch (e) {
          console.warn('Could not fetch campus.json, using embedded data:', e.message);
        }
      }

      if (CAMPUS_DATA && CAMPUS_DATA.buildings) {
        CAMPUS_DATA.buildings.forEach(b => {
          const bLevels = b.levels || 1;
          (b.rooms || []).forEach(r => {
            if (r.floor === undefined || r.floor < 1) r.floor = 1;
            if (r.floor > bLevels) r.floor = bLevels;
          });
        });
      }

      rebuildCampus(CAMPUS_DATA);

      // Frame camera around all buildings (polygon-aware)
      const buildings = CAMPUS_DATA.buildings;
      if (buildings.length > 0) {
        const bounds = { minX: Infinity, maxX: -Infinity, minZ: Infinity, maxZ: -Infinity, maxHeight: 0 };
        buildings.forEach(b => {
          ensureFootprint(b);
          const rot = THREE.MathUtils.degToRad(b.rotation || 0);
          const cosR = Math.cos(rot), sinR = Math.sin(rot);
          for (const [vx, vz] of b.footprint) {
            const wx = b.x + cosR * vx - sinR * vz;
            const wz = b.z + sinR * vx + cosR * vz;
            bounds.minX = Math.min(bounds.minX, wx);
            bounds.maxX = Math.max(bounds.maxX, wx);
            bounds.minZ = Math.min(bounds.minZ, wz);
            bounds.maxZ = Math.max(bounds.maxZ, wz);
          }
          bounds.maxHeight = Math.max(bounds.maxHeight, getBuildingHeight(b));
        });

        const centerX = (bounds.minX + bounds.maxX) / 2;
        const centerZ = (bounds.minZ + bounds.maxZ) / 2;
        const spanX = bounds.maxX - bounds.minX;
        const spanZ = bounds.maxZ - bounds.minZ;
        const maxSpan = Math.max(spanX, spanZ);
        const distance = maxSpan * 1.2 + bounds.maxHeight;

        controls.target.set(centerX, bounds.maxHeight / 2, centerZ);
        camera.position.set(centerX, distance * 0.7, centerZ + distance * 0.8);
        controls.update();
      }

      document.getElementById('loading').style.display = 'none';
    }

    // --- Level Editor ---
    const EDIT_ENABLED = new URLSearchParams(window.location.search).has('edit');
    let editActive = false;
    let editorDrawMode = null; // null = select, 'building', 'road'
    let drawPoints = [];       // points being drawn
    let drawPreviewLine = null;
    let editorSelected = null; // { type: 'building'|'road', data, index }
    let editorHandles = [];    // vertex handle meshes

    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    // --- Grid-Select Room Tool State ---
    let splitMode = false;

    let splitCurrentLevel = 1;      // currently selected floor (1..levels)
    let splitGridCells = [];        // array of { id, minX, maxX, minZ, maxZ, polygon, isLocked, isSelected }
    let splitSelectedCells = new Set(); // set of cell ids
    let splitHistory = [];          // undo stack: snapshots of building.rooms
    let splitVisualMeshes = [];     // Three.js meshes/lines for grid and rooms
    let splitSavedCamera = null;    // camera state before split mode
    let splitIsPointerDown = false;
    let splitDragSelectMode = true; // true = selecting, false = deselecting

    // --- Geometry Helpers for Grid Clipping & Union ---
    function polygonArea(poly) {
      if (!poly || poly.length < 3) return 0;
      let area = 0;
      for (let i = 0; i < poly.length; i++) {
        const j = (i + 1) % poly.length;
        area += poly[i][0] * poly[j][1] - poly[j][0] * poly[i][1];
      }
      return Math.abs(area) / 2;
    }

    function pointInPolygon(pt, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], zi = poly[i][1];
        const xj = poly[j][0], zj = poly[j][1];
        const intersect = ((zi > pt[1]) !== (zj > pt[1])) &&
          (pt[0] < (xj - xi) * (pt[1] - zi) / (zj - zi + 1e-12) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // Sutherland-Hodgman polygon clipping against an infinite directed line (ax, ay)->(bx, by)
    // Points to the left of the line (or counter-clockwise) are kept.
    function clipPolygonByLine(poly, a, b) {
      const out = [];
      if (!poly || poly.length === 0) return out;
      const isInside = (p) => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]) >= -1e-9;
      const lineIntersect = (p1, p2) => {
        const d1x = p2[0] - p1[0], d1z = p2[1] - p1[1];
        const d2x = b[0] - a[0],  d2z = b[1] - a[1];
        const denom = d1x * d2z - d1z * d2x;
        if (Math.abs(denom) < 1e-11) return p1.slice();
        const t = ((a[0] - p1[0]) * d2z - (a[1] - p1[1]) * d2x) / denom;
        return [p1[0] + t * d1x, p1[1] + t * d1z];
      };

      for (let i = 0; i < poly.length; i++) {
        const curr = poly[i];
        const prev = poly[(i + poly.length - 1) % poly.length];
        const currIn = isInside(curr);
        const prevIn = isInside(prev);

        if (currIn) {
          if (!prevIn) out.push(lineIntersect(prev, curr));
          out.push(curr.slice());
        } else if (prevIn) {
          out.push(lineIntersect(prev, curr));
        }
      }
      return out;
    }

    // Clip a convex subject polygon (e.g. rect cell) against an arbitrary polygon (or clip rect against polygon edges)
    function clipPolygonAgainstBox(poly, minX, maxX, minZ, maxZ) {
      let res = poly.map(p => p.slice());
      // Clip against minX (x >= minX): line (minX, maxZ) -> (minX, minZ)
      res = clipPolygonByLine(res, [minX, maxZ], [minX, minZ]);
      // Clip against maxZ (z <= maxZ): line (minX, maxZ) -> (maxX, maxZ) ... left side is z <= maxZ
      res = clipPolygonByLine(res, [maxX, maxZ], [minX, maxZ]);
      // Clip against maxX (x <= maxX): line (maxX, minZ) -> (maxX, maxZ)
      res = clipPolygonByLine(res, [maxX, minZ], [maxX, maxZ]);
      // Clip against minZ (z >= minZ): line (minX, minZ) -> (maxX, minZ)
      res = clipPolygonByLine(res, [minX, minZ], [maxX, minZ]);
      return res;
    }

    // Union a collection of polygons (e.g. adjacent square cells).
    // Walks boundary edges, dropping internal/coincident opposite-directed edges.
    function unionCellPolygons(polygons) {
      if (!polygons || polygons.length === 0) return [];
      if (polygons.length === 1) return polygons[0].map(p => p.slice());

      // Collect all directed edges
      const edges = [];
      const ptKey = (p) => `${Math.round(p[0] * 1000) / 1000},${Math.round(p[1] * 1000) / 1000}`;

      polygons.forEach(poly => {
        for (let i = 0; i < poly.length; i++) {
          const p1 = poly[i];
          const p2 = poly[(i + 1) % poly.length];
          const k1 = ptKey(p1), k2 = ptKey(p2);
          if (k1 === k2) continue;
          edges.push({ p1, p2, k1, k2 });
        }
      });

      // Filter out internal shared edges: edges having a reverse counterpart
      const boundaryEdges = [];
      for (let i = 0; i < edges.length; i++) {
        const e1 = edges[i];
        let hasOpposite = false;
        for (let j = 0; j < edges.length; j++) {
          if (i === j) continue;
          const e2 = edges[j];
          if (e1.k1 === e2.k2 && e1.k2 === e2.k1) {
            hasOpposite = true;
            break;
          }
        }
        if (!hasOpposite) {
          boundaryEdges.push(e1);
        }
      }

      if (boundaryEdges.length === 0) return polygons[0].map(p => p.slice());

      // Stitch boundary edges into closed loops
      const loops = [];
      const visited = new Set();

      for (let i = 0; i < boundaryEdges.length; i++) {
        if (visited.has(i)) continue;
        const loop = [];
        let currIndex = i;

        while (currIndex !== -1 && !visited.has(currIndex)) {
          visited.add(currIndex);
          const edge = boundaryEdges[currIndex];
          loop.push(edge.p1.slice());
          const nextTarget = edge.k2;

          // Find matching next edge
          let nextIndex = -1;
          for (let j = 0; j < boundaryEdges.length; j++) {
            if (!visited.has(j) && boundaryEdges[j].k1 === nextTarget) {
              nextIndex = j;
              break;
            }
          }
          currIndex = nextIndex;
        }

        if (loop.length >= 3) {
          loops.push(loop);
        }
      }

      if (loops.length === 0) return polygons[0].map(p => p.slice());
      // Return the largest loop by area
      loops.sort((a, b) => polygonArea(b) - polygonArea(a));
      return loops[0];
    }

    // Convert world coords to building local coords
    function worldToLocal(wx, wz, building) {
      const rot = -THREE.MathUtils.degToRad(building.rotation || 0);
      const dx = wx - building.x, dz = wz - building.z;
      return [Math.cos(rot) * dx - Math.sin(rot) * dz, Math.sin(rot) * dx + Math.cos(rot) * dz];
    }

    // Convert building local coords to world coords
    function localToWorld(lx, lz, building) {
      const rot = THREE.MathUtils.degToRad(building.rotation || 0);
      return [building.x + Math.cos(rot) * lx - Math.sin(rot) * lz,
              building.z + Math.sin(rot) * lx + Math.cos(rot) * lz];
    }

    // Room piece colors (for visual distinction)
    const ROOM_COLORS = [0x00ffff, 0xff00ff, 0xffff00, 0x00ff88, 0xff8800, 0x88ff00, 0x0088ff, 0xff0088];

    function getGroundPoint(mx, my) {
      const ndc = new THREE.Vector2(mx, my);
      raycaster.setFromCamera(ndc, camera);
      const target = new THREE.Vector3();
      raycaster.ray.intersectPlane(groundPlane, target);
      return target;
    }

    // Autosave
    function autosaveDraft() {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(CAMPUS_DATA));

    // Show/hide edit hint
    const editHintEl = document.getElementById('editHint');

    // --- Editor UI wiring ---
    if (EDIT_ENABLED) {
      document.getElementById('editToolbar').style.display = 'flex';

      const editToggleBtn = document.getElementById('editToggle');
      const editToolsDiv = document.getElementById('editTools');
      const editFormDiv = document.getElementById('editForm');
      const editBuildingForm = document.getElementById('editBuildingForm');
      const editRoadForm = document.getElementById('editRoadForm');

      editToggleBtn.addEventListener('click', () => {
        editActive = !editActive;
        editToggleBtn.classList.toggle('active', editActive);
        editToolsDiv.style.display = editActive ? 'flex' : 'none';
        if (editActive) {
          // Save camera, switch to top-down
          savedCameraState = { pos: camera.position.clone(), target: controls.target.clone(), polar: controls.maxPolarAngle };
          const b = { minX: -100, maxX: 100, minZ: -100, maxZ: 100 };
          CAMPUS_DATA.buildings.forEach(bl => {
            ensureFootprint(bl);
            b.minX = Math.min(b.minX, bl.x - 20); b.maxX = Math.max(b.maxX, bl.x + 20);
            b.minZ = Math.min(b.minZ, bl.z - 20); b.maxZ = Math.max(b.maxZ, bl.z + 20);
          });
          const cx = (b.minX + b.maxX) / 2, cz = (b.minZ + b.maxZ) / 2;
          controls.target.set(cx, 0, cz);
          camera.position.set(cx, 120, cz + 0.01);
          controls.maxPolarAngle = 0.15;
          controls.update();
